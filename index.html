<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧洗衣分類 (執行力測試 MVP)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { 
    font-family: 'Noto Sans TC', sans-serif; 
    background-color: #1a2e1a; /* GO HEALTH 品牌深綠底色 */
    display: flex; justify-content: center; align-items: center; 
    height: 100vh; overflow: hidden; color: #e8f5e8;
  }

  #app-container {
    position: relative; width: 100%; max-width: 480px; height: 100vh; max-height: 850px;
    display: flex; flex-direction: column; background: #233a23;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }

  /* 頂部正向資訊列 */
  #header {
    padding: 20px 15px; background: rgba(10, 20, 10, 0.6);
    border-bottom: 3px solid #3DBE7A; text-align: center;
  }
  #score-display { font-size: 16px; color: #3DBE7A; font-weight: 700; margin-bottom: 8px; }
  #instruction { font-size: 22px; font-weight: 900; line-height: 1.4; transition: color 0.3s; }
  .highlight { color: #FFB800; }

  /* 遊戲主要互動區 */
  #game-area {
    flex: 1; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; position: relative;
  }

  /* 衣服物件 */
  #item-display {
    width: 120px; height: 120px; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 60px; background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: transform 0.2s, opacity 0.2s;
  }
  .item-dark { background: #4a4a4a; border: 4px solid #222; }
  .item-light { background: #f5f5f5; border: 4px solid #ddd; }
  .tag-ripped {
    font-size: 16px; background: #E53935; color: #fff; 
    padding: 2px 8px; border-radius: 8px; margin-top: -10px; font-weight: 700;
  }

  /* 錯誤震動動畫 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-5deg); }
    75% { transform: translateX(10px) rotate(5deg); }
  }
  .shake-error { animation: shake 0.3s ease-in-out; }
  .success-pop { transform: scale(0) !important; opacity: 0; }

  /* 底部籃子區 */
  #bins-container {
    display: flex; justify-content: space-around; width: 100%; padding: 20px 10px 40px;
    background: rgba(0,0,0,0.2);
  }
  .bin {
    display: flex; flex-direction: column; align-items: center;
    padding: 15px; border-radius: 16px; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(61,190,122,0.3); cursor: pointer; transition: all 0.1s;
    width: 30%;
  }
  .bin:active { transform: scale(0.95); background: rgba(61,190,122,0.2); }
  .bin-icon { font-size: 45px; margin-bottom: 5px; }
  .bin-label { font-size: 14px; font-weight: 700; color: #a5d6a7; text-align: center; }

  /* 隱藏的開發者 Debug 儀表板 */
  #debug-panel {
    position: absolute; bottom: 10px; left: 10px; font-family: monospace; font-size: 11px;
    color: #0f0; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 5px; pointer-events: none;
  }

  /* 結算畫面 */
  #result-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a2e1a; display: none; flex-direction: column; 
    align-items: center; justify-content: center; z-index: 999; text-align: center;
  }
  .result-title { font-size: 32px; color: #3DBE7A; font-weight: 900; margin-bottom: 20px; }
  .result-data { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; margin-bottom: 30px; text-align: left;}
  .result-data div { font-size: 16px; margin: 8px 0; color: #e8f5e8; }
  .restart-btn {
    background: #3DBE7A; color: #fff; font-size: 18px; font-weight: 700;
    padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="app-container">
  
  <div id="header">
    <div id="score-display">🌟 已分類 0 件</div>
    <div id="instruction">請將衣物依顏色分類！</div>
  </div>

  <div id="game-area">
    <div id="item-display" class="item-dark">
      <div id="item-emoji">🧥</div>
    </div>
  </div>

  <div id="bins-container">
    <div class="bin" onclick="handleBinClick('left')">
      <div class="bin-icon">🧺</div>
      <div class="bin-label" id="label-left">深色衣物</div>
    </div>
    <div class="bin" onclick="handleBinClick('trash')">
      <div class="bin-icon">🗑️</div>
      <div class="bin-label" style="color: #ef5350;">破洞丟棄</div>
    </div>
    <div class="bin" onclick="handleBinClick('right')">
      <div class="bin-icon">🧺</div>
      <div class="bin-label" id="label-right">淺色衣物</div>
    </div>
  </div>

  <div id="debug-panel">
    [API Metrics]<br>
    Phase: <span id="dbg-phase">1</span><br>
    Timer: <span id="dbg-timer">0</span>s<br>
    planning_latency_ms: <span id="dbg-latency">0</span><br>
    rule_reconfig_ms: <span id="dbg-reconfig">0</span><br>
    commission_errors: <span id="dbg-commission">0</span>
  </div>

  <div id="result-screen">
    <div class="result-title">🎉 家事達人！</div>
    <div style="font-size: 18px; margin-bottom: 20px;">您今天成功整理了 <span id="res-total" style="color: #FFB800; font-weight: bold; font-size: 24px;">0</span> 件衣物！</div>
    
    <div class="result-data">
      <div style="color:#5a8a5a; font-size: 12px; margin-bottom: 10px;">[底層隱性醫療數據萃取]</div>
      <div>處理反應時間： <span id="res-latency" class="highlight">0</span> ms</div>
      <div>規則切換延遲： <span id="res-reconfig" class="highlight">0</span> ms</div>
      <div>衝動錯誤次數： <span id="res-commission" class="highlight">0</span> 次</div>
    </div>
    
    <button class="restart-btn" onclick="initGame()">再測一次</button>
  </div>

</div>

<script>
/**
 * 核心醫療遊戲狀態機 (State Machine)
 */
let gs = {
  phase: 1,
  timer: 0,
  intervalId: null,
  sortedCount: 0,
  isLocked: false,          // 防連點鎖
  currentItem: null,
  itemSpawnTime: 0,
  waitingForReconfig: false,// 標記是否正在測量規則切換延遲
  metrics: {
    latencies: [],          // 收集所有正常的決策時間
    reconfigLatency: null,  // 記錄規則改變後第一次做對的時間
    commission: 0           // 點錯次數
  }
};

// 題庫定義
const CLOTHES = {
  dark: { type: 'dark', emojis: ['🧥', '👖', '👔'] },
  light: { type: 'light', emojis: ['👕', '🩲', '🧦'] }
};

// DOM 元素快取
const elItem = document.getElementById('item-display');
const elEmoji = document.getElementById('item-emoji');
const elInstruction = document.getElementById('instruction');
const elScore = document.getElementById('score-display');
const elLabelLeft = document.getElementById('label-left');
const elLabelRight = document.getElementById('label-right');

/**
 * 初始化 / 重置遊戲
 */
function initGame() {
  gs = {
    phase: 1, timer: 0, intervalId: null, sortedCount: 0, isLocked: false,
    currentItem: null, itemSpawnTime: 0, waitingForReconfig: false,
    metrics: { latencies: [], reconfigLatency: null, commission: 0 }
  };
  
  document.getElementById('result-screen').style.display = 'none';
  elScore.innerText = `🌟 已分類 0 件`;
  
  applyPhaseRules();
  spawnItem();
  
  // 啟動隱性 60 秒計時器
  gs.intervalId = setInterval(gameTick, 1000);
}

/**
 * 背景計時器邏輯 (無倒數 UI)
 */
function gameTick() {
  gs.timer++;
  document.getElementById('dbg-timer').innerText = gs.timer;

  // 階段切換控制
  if (gs.timer === 20 && gs.phase === 1) {
    gs.phase = 2;
    gs.waitingForReconfig = true; // 準備捕捉切換延遲
    applyPhaseRules();
  } 
  else if (gs.timer === 40 && gs.phase === 2) {
    gs.phase = 3;
    gs.waitingForReconfig = true; 
    applyPhaseRules();
  }
  else if (gs.timer >= 60) {
    endGame();
  }
}

/**
 * 套用當前階段的 UI 與規則
 */
function applyPhaseRules() {
  document.getElementById('dbg-phase').innerText = gs.phase;
  
  if (gs.phase === 1) {
    elInstruction.innerHTML = "深色放<span class="highlight">左</span>，淺色放<span class="highlight">右</span>";
    elLabelLeft.innerText = "深色衣物";
    elLabelRight.innerText = "淺色衣物";
  } 
  else if (gs.phase === 2) {
    // 規則反轉 (Rule Reversal)
    elInstruction.innerHTML = "⚠️ 規則反轉：深色改放<span class="highlight">右</span>！";
    elInstruction.style.color = "#FFB800";
    elLabelLeft.innerText = "淺色衣物";
    elLabelRight.innerText = "深色衣物";
  }
  else if (gs.phase === 3) {
    // 抑制控制 (Go/No-Go) 啟動
    elInstruction.innerHTML = "⚠️ <span style='color:#E53935'>破洞衣物</span> 請直接丟垃圾桶！";
    elInstruction.style.color = "#fff";
  }
}

/**
 * 生成新衣物
 */
function spawnItem() {
  // 移除上一次的舊類別與動畫
  elItem.className = '';
  elItem.innerHTML = '<div id="item-emoji"></div>';
  const newElEmoji = document.getElementById('item-emoji');

  // 隨機決定顏色
  const isDark = Math.random() > 0.5;
  const pool = isDark ? CLOTHES.dark : CLOTHES.light;
  const emoji = pool.emojis[Math.floor(Math.random() * pool.emojis.length)];
  
  // Phase 3 才有 30% 機率出現破洞衣物
  const isRipped = (gs.phase === 3 && Math.random() > 0.7);

  gs.currentItem = {
    color: pool.type,
    isRipped: isRipped,
    correctBin: determineCorrectBin(pool.type, isRipped)
  };

  // 渲染 UI
  elItem.classList.add(isDark ? 'item-dark' : 'item-light');
  newElEmoji.innerText = emoji;
  if (isRipped) {
    elItem.innerHTML += `<div class="tag-ripped">破洞</div>`;
  }

  // 記錄出現時間，用於計算延遲
  gs.itemSpawnTime = Date.now();
  gs.isLocked = false;
}

/**
 * 判斷標準答案 (核心認知邏輯)
 */
function determineCorrectBin(colorType, isRipped) {
  if (isRipped) return 'trash'; // Phase 3 的絕對優先規則
  
  if (gs.phase === 1) {
    return colorType === 'dark' ? 'left' : 'right';
  } else {
    // Phase 2 & 3 規則反轉
    return colorType === 'dark' ? 'right' : 'left';
  }
}

/**
 * 處理玩家點擊籃子
 */
function handleBinClick(binId) {
  if (gs.isLocked) return;
  const now = Date.now();
  
  if (binId === gs.currentItem.correctBin) {
    // 答對邏輯
    gs.isLocked = true;
    gs.sortedCount++;
    elScore.innerText = `🌟 已分類 ${gs.sortedCount} 件`;
    
    // 計算反應延遲
    const latency = now - gs.itemSpawnTime;
    
    if (gs.waitingForReconfig) {
      // 這是規則改變後的第一個正確反應
      gs.metrics.reconfigLatency = latency;
      document.getElementById('dbg-reconfig').innerText = latency;
      gs.waitingForReconfig = false;
    } else {
      // 一般的處理反應時間
      gs.metrics.latencies.push(latency);
      document.getElementById('dbg-latency').innerText = latency;
    }
    
    // 正向回饋動畫：衣服縮小消失
    elItem.classList.add('success-pop');
    setTimeout(spawnItem, 250); // 250ms 後產生下一件
    
  } else {
    // 答錯邏輯 (無錯誤學習：不扣分、不跳錯誤，只記錄衝動並震動提示)
    gs.metrics.commission++;
    document.getElementById('dbg-commission').innerText = gs.metrics.commission;
    
    // 觸發震動
    elItem.classList.remove('shake-error');
    void elItem.offsetWidth; // 觸發 reflow 讓動畫可重播
    elItem.classList.add('shake-error');
  }
}

/**
 * 結算遊戲並計算常模指標
 */
function endGame() {
  clearInterval(gs.intervalId);
  gs.isLocked = true;
  
  // 計算平均 Latency (排除偏差值)
  let avgLatency = 0;
  if (gs.metrics.latencies.length > 0) {
    const sum = gs.metrics.latencies.reduce((a, b) => a + b, 0);
    avgLatency = Math.round(sum / gs.metrics.latencies.length);
  }

  // 填入結算畫面
  document.getElementById('res-total').innerText = gs.sortedCount;
  document.getElementById('res-latency').innerText = avgLatency;
  document.getElementById('res-reconfig').innerText = gs.metrics.reconfigLatency || 'N/A';
  document.getElementById('res-commission').innerText = gs.metrics.commission;
  
  // 顯示結算板
  document.getElementById('result-screen').style.display = 'flex';
}

// 預設啟動
window.onload = initGame;
</script>
</body>
</html>

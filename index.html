<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧洗衣分類 (執行力測試 MVP)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { 
    font-family: 'Noto Sans TC', sans-serif; 
    background-color: #1a2e1a; 
    display: flex; justify-content: center; align-items: center; 
    height: 100vh; overflow: hidden; color: #e8f5e8;
  }

  #app-container {
    position: relative; width: 100%; max-width: 480px; height: 100vh; max-height: 850px;
    display: flex; flex-direction: column; background: #233a23;
    box-shadow: 0 0 30px rgba(0,0,0,0.5); overflow: hidden;
  }

  /* 首頁登錄畫面 */
  #start-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a2e1a; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; z-index: 1000; padding: 30px;
    text-align: center;
  }
  .start-title { font-size: 32px; color: #3DBE7A; font-weight: 900; margin-bottom: 15px; }
  .start-desc { font-size: 16px; color: #a5d6a7; margin-bottom: 30px; line-height: 1.6; }
  .input-field {
    width: 80%; padding: 15px; margin-bottom: 15px; border-radius: 12px;
    border: 2px solid #3DBE7A; background: rgba(255,255,255,0.1); color: #fff;
    font-size: 16px; font-family: 'Noto Sans TC', sans-serif; text-align: center;
  }
  .input-field::placeholder { color: #888; }
  .start-btn {
    background: #3DBE7A; color: #fff; font-size: 18px; font-weight: 700;
    padding: 15px 40px; border: none; border-radius: 50px; cursor: pointer;
    margin-top: 15px; width: 80%; box-shadow: 0 4px 15px rgba(61,190,122,0.4);
    transition: transform 0.1s;
  }
  .start-btn:active { transform: scale(0.95); }

  /* 頂部正向資訊列 */
  #header {
    padding: 20px 15px; background: rgba(10, 20, 10, 0.6);
    border-bottom: 3px solid #3DBE7A; text-align: center;
  }
  #score-display { font-size: 16px; color: #3DBE7A; font-weight: 700; margin-bottom: 8px; }
  #instruction { font-size: 22px; font-weight: 900; line-height: 1.4; transition: color 0.3s; }
  .highlight { color: #FFB800; }

  /* 遊戲主要互動區 */
  #game-area {
    flex: 1; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; position: relative;
  }

  #item-display {
    width: 130px; height: 130px; border-radius: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 70px; background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    border: 4px solid #ddd;
    transition: transform 0.2s, opacity 0.2s;
  }

  /* 錯誤震動動畫 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-5deg); }
    75% { transform: translateX(10px) rotate(5deg); }
  }
  .shake-error { animation: shake 0.3s ease-in-out; }
  .success-pop { transform: scale(0) !important; opacity: 0; }

  /* 底部籃子區 */
  #bins-container {
    display: flex; justify-content: space-around; width: 100%; padding: 20px 10px 40px;
    background: rgba(0,0,0,0.2);
  }
  .bin {
    display: flex; flex-direction: column; align-items: center;
    padding: 15px; border-radius: 16px; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(61,190,122,0.3); cursor: pointer; transition: all 0.1s;
    width: 30%;
  }
  .bin:active { transform: scale(0.95); background: rgba(61,190,122,0.2); }
  .bin-icon { font-size: 45px; margin-bottom: 5px; }
  .bin-label { font-size: 16px; font-weight: 700; color: #a5d6a7; text-align: center; }

  /* 隱藏 API Metrics */
  #debug-panel { display: none; }

  /* 結算畫面 */
  #result-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a2e1a; display: none; flex-direction: column; 
    align-items: center; justify-content: center; z-index: 999; text-align: center;
  }
  .result-title { font-size: 32px; color: #3DBE7A; font-weight: 900; margin-bottom: 10px; }
  .result-name { font-size: 20px; color: #fff; margin-bottom: 20px; }
  .result-data { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; margin-bottom: 30px; text-align: left; width: 80%;}
  .result-data div { font-size: 16px; margin: 8px 0; color: #e8f5e8; }
</style>
</head>
<body>

<div id="app-container">

  <div id="start-screen">
    <div class="start-title">家事達人：衣物分類</div>
    <div class="start-desc">
      👕 遊戲說明 👚<br><br>
      畫面會隨機出現上衣或褲子。<br>
      請仔細閱讀上方的「分類規則」，<br>
      並將衣物投入正確的洗衣籃中。<br><br>
      ⚠️ 提示：規則可能會隨時改變喔！
    </div>
    <input type="text" id="player-name" class="input-field" placeholder="請輸入姓名">
    <input type="number" id="player-age" class="input-field" placeholder="請輸入年齡 (歲)">
    <button class="start-btn" onclick="startGame()">開始挑戰</button>
  </div>
  
  <div id="header">
    <div id="score-display">🌟 已分類 0 件</div>
    <div id="instruction">請將衣物依款式分類！</div>
  </div>

  <div id="game-area">
    <div id="item-display">
      <div id="item-emoji">👕</div>
    </div>
  </div>

  <div id="bins-container">
    <div class="bin" onclick="handleBinClick('left')">
      <div class="bin-icon">🧺</div>
      <div class="bin-label" id="label-left">上衣類</div>
    </div>
    <div class="bin" onclick="handleBinClick('trash')">
      <div class="bin-icon">🗑️</div>
      <div class="bin-label" style="color: #ef5350;">襪子丟棄</div>
    </div>
    <div class="bin" onclick="handleBinClick('right')">
      <div class="bin-icon">🧺</div>
      <div class="bin-label" id="label-right">褲子類</div>
    </div>
  </div>

  <div id="debug-panel">
    Phase: <span id="dbg-phase">1</span>
    Timer: <span id="dbg-timer">0</span>
    planning: <span id="dbg-latency">0</span>
    reconfig: <span id="dbg-reconfig">0</span>
    commission: <span id="dbg-commission">0</span>
  </div>

  <div id="result-screen">
    <div class="result-title">🎉 挑戰完成！</div>
    <div class="result-name" id="res-player"></div>
    <div style="font-size: 18px; margin-bottom: 20px;">您今天成功整理了 <span id="res-total" style="color: #FFB800; font-weight: bold; font-size: 28px;">0</span> 件衣物！</div>
    
    <div class="result-data">
      <div style="color:#5a8a5a; font-size: 12px; margin-bottom: 10px;">[底層隱性醫療數據萃取]</div>
      <div>處理反應時間： <span id="res-latency" class="highlight">0</span> ms</div>
      <div>規則切換延遲： <span id="res-reconfig" class="highlight">0</span> ms</div>
      <div>衝動錯誤次數： <span id="res-commission" class="highlight">0</span> 次</div>
    </div>
    
    <button class="start-btn" onclick="location.reload()">重新開始</button>
  </div>

</div>

<script>
let gs = {
  playerName: '',
  playerAge: '',
  phase: 1,
  timer: 0,
  intervalId: null,
  sortedCount: 0,
  isLocked: false,
  currentItem: null,
  itemSpawnTime: 0,
  waitingForReconfig: false,
  metrics: {
    latencies: [],
    reconfigLatency: null,
    commission: 0
  }
};

const CLOTHES = {
  top: { type: 'top', emojis: ['👕', '👔', '🧥'] },
  bottom: { type: 'bottom', emojis: ['👖', '🩳'] }
};
const SOCK_EMOJI = '🧦';

const elItem = document.getElementById('item-display');
const elEmoji = document.getElementById('item-emoji');
const elInstruction = document.getElementById('instruction');
const elScore = document.getElementById('score-display');
const elLabelLeft = document.getElementById('label-left');
const elLabelRight = document.getElementById('label-right');

function startGame() {
  const nameInput = document.getElementById('player-name').value.trim();
  const ageInput = document.getElementById('player-age').value.trim();
  
  if (!nameInput || !ageInput) {
    alert("請填寫姓名與年齡，才能建立您的專屬評估報告！");
    return;
  }
  
  gs.playerName = nameInput;
  gs.playerAge = ageInput;
  
  document.getElementById('start-screen').style.display = 'none';
  initGame();
}

function initGame() {
  applyPhaseRules();
  spawnItem();
  gs.intervalId = setInterval(gameTick, 1000);
}

function gameTick() {
  gs.timer++;
  document.getElementById('dbg-timer').innerText = gs.timer;

  // 階段切換時，強制呼叫 spawnItem() 刷新題目，消除舊規則殘留的時間差
  if (gs.timer === 20 && gs.phase === 1) {
    gs.phase = 2;
    gs.waitingForReconfig = true;
    applyPhaseRules();
    spawnItem(); 
  } 
  else if (gs.timer === 40 && gs.phase === 2) {
    gs.phase = 3;
    gs.waitingForReconfig = true; 
    applyPhaseRules();
    spawnItem(); 
  }
  else if (gs.timer >= 60) {
    endGame();
  }
}

function applyPhaseRules() {
  document.getElementById('dbg-phase').innerText = gs.phase;
  
  if (gs.phase === 1) {
    elInstruction.innerHTML = "上衣放<span class='highlight'>左</span>，褲子放<span class='highlight'>右</span>";
    elLabelLeft.innerText = "上衣類";
    elLabelRight.innerText = "褲子類";
  } 
  else if (gs.phase === 2) {
    elInstruction.innerHTML = "⚠️ 規則反轉：上衣改放<span class='highlight'>右</span>！";
    elInstruction.style.color = "#FFB800";
    elLabelLeft.innerText = "褲子類";
    elLabelRight.innerText = "上衣類";
  }
  else if (gs.phase === 3) {
    elInstruction.innerHTML = "⚠️ 看到 <span style='color:#E53935'>襪子🧦</span> 請直接丟垃圾桶！";
    elInstruction.style.color = "#fff";
  }
}

function spawnItem() {
  elItem.className = '';
  const isSock = (gs.phase === 3 && Math.random() > 0.7);
  let itemType, emoji;

  if (isSock) {
    itemType = 'sock';
    emoji = SOCK_EMOJI;
  } else {
    const isTop = Math.random() > 0.5;
    const pool = isTop ? CLOTHES.top : CLOTHES.bottom;
    itemType = pool.type;
    emoji = pool.emojis[Math.floor(Math.random() * pool.emojis.length)];
  }

  gs.currentItem = {
    type: itemType,
    correctBin: determineCorrectBin(itemType)
  };

  elEmoji.innerText = emoji;
  gs.itemSpawnTime = Date.now();
  gs.isLocked = false;
}

function determineCorrectBin(itemType) {
  if (itemType === 'sock') return 'trash';
  if (gs.phase === 1) return itemType === 'top' ? 'left' : 'right';
  return itemType === 'top' ? 'right' : 'left'; 
}

function handleBinClick(binId) {
  if (gs.isLocked) return;
  const now = Date.now();
  
  if (binId === gs.currentItem.correctBin) {
    gs.isLocked = true;
    gs.sortedCount++;
    elScore.innerText = `🌟 已分類 ${gs.sortedCount} 件`;
    
    const latency = now - gs.itemSpawnTime;
    
    if (gs.waitingForReconfig) {
      gs.metrics.reconfigLatency = latency;
      document.getElementById('dbg-reconfig').innerText = latency;
      gs.waitingForReconfig = false;
    } else {
      gs.metrics.latencies.push(latency);
      document.getElementById('dbg-latency').innerText = latency;
    }
    
    elItem.classList.add('success-pop');
    setTimeout(spawnItem, 250); 
    
  } else {
    gs.metrics.commission++;
    document.getElementById('dbg-commission').innerText = gs.metrics.commission;
    
    elItem.classList.remove('shake-error');
    void elItem.offsetWidth;
    elItem.classList.add('shake-error');
  }
}

function endGame() {
  clearInterval(gs.intervalId);
  gs.isLocked = true;
  
  let avgLatency = 0;
  if (gs.metrics.latencies.length > 0) {
    const sum = gs.metrics.latencies.reduce((a, b) => a + b, 0);
    avgLatency = Math.round(sum / gs.metrics.latencies.length);
  }

  document.getElementById('res-player').innerText = `${gs.playerName} (${gs.playerAge}歲) 的表現：`;
  document.getElementById('res-total').innerText = gs.sortedCount;
  document.getElementById('res-latency').innerText = avgLatency;
  document.getElementById('res-reconfig').innerText = gs.metrics.reconfigLatency || 'N/A';
  document.getElementById('res-commission').innerText = gs.metrics.commission;
  
  document.getElementById('result-screen').style.display = 'flex';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>家事達人的一天 (動態版型優化)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body { 
    font-family: 'Noto Sans TC', sans-serif; 
    background-color: #f8fafc; 
    display: flex; justify-content: center; align-items: center; 
    min-height: 100vh; overflow: hidden; color: #334155;
  }

  #app-container {
    position: relative; width: 100%; max-width: 430px; height: 100vh; max-height: 900px;
    display: flex; flex-direction: column; 
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.1); overflow: hidden;
  }

  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; flex-direction: column; background: transparent; z-index: 10;
  }
  .screen.active { display: flex; }

  .btn {
    background: #10b981; color: #fff; font-size: 18px; font-weight: 700;
    padding: 16px 24px; border: none; border-radius: 20px; cursor: pointer;
    box-shadow: 0 6px 0 #059669; transition: all 0.1s; width: 100%;
  }
  .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #059669; }

  /* 首頁 */
  #home-screen { padding: 40px 24px; overflow-y: auto; }
  .home-title { font-size: 32px; color: #059669; font-weight: 900; margin-bottom: 8px; }
  .home-desc { font-size: 15px; color: #64748b; margin-bottom: 32px; }
  
  .level-card {
    background: rgba(255,255,255,0.7); border: 2px solid #fff;
    border-radius: 24px; padding: 20px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.04);
  }
  .level-card:active { transform: scale(0.97); }
  .lv-badge { background: #d1fae5; color: #059669; font-size: 12px; font-weight: 900; padding: 6px 10px; border-radius: 10px; width: fit-content; }
  .lv-title { font-size: 18px; font-weight: 700; color: #1e293b; }

  /* 遊戲畫面 */
  #header {
    padding: 24px 20px 16px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0,0,0,0.05); text-align: center; z-index: 20;
  }
  #progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  #progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s ease; }
  #instruction { font-size: 20px; font-weight: 900; line-height: 1.4; min-height: 56px; display: flex; align-items: center; justify-content: center; }

  #game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  
  /* 任務物件展示區 */
  #item-display {
    width: 150px; height: 150px; border-radius: 36px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 80px; background: #ffffff; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 4px solid #fff;
    transition: transform 0.2s, opacity 0.2s, background-color 0.2s; position: relative;
  }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-12px) rotate(-8deg); } 75% { transform: translateX(12px) rotate(8deg); } }
  .shake-error { animation: shake 0.3s ease-in-out; border-color: #f43f5e !important; }
  .success-pop { transform: scale(0.5) translateY(100px) !important; opacity: 0; }

  /* 廣播與並行任務 UI */
  .overlay-alert {
    position: absolute; top: 10%; left: 10%; width: 80%;
    background: rgba(244, 63, 94, 0.95); padding: 20px; border-radius: 24px; color: white;
    text-align: center; font-weight: 900; font-size: 20px; box-shadow: 0 20px 40px rgba(244,63,94,0.3);
    transform: scale(0); transition: transform 0.3s; z-index: 100;
  }
  .overlay-alert.show { transform: scale(1); }

  #parallel-task {
    position: absolute; top: 20px; right: 20px;
    background: #f59e0b; padding: 12px 20px; border-radius: 20px; color: white;
    font-size: 16px; font-weight: 900; box-shadow: 0 6px 0 #b45309;
    transform: scale(0); transition: transform 0.2s; z-index: 50; display: flex; flex-direction: column; align-items: center; cursor: pointer;
  }
  #parallel-task.show { transform: scale(1); animation: shakeBoil 0.5s infinite ease-in-out; }
  @keyframes shakeBoil { 0%, 100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.05) rotate(-5deg); } 75% { transform: scale(1.05) rotate(5deg); } }

  /* 底部籃子區 - 支援多種動態排版 */
  #bins-container {
    padding: 20px 20px 40px; background: rgba(255,255,255,0.6); backdrop-filter: blur(15px);
    display: grid; gap: 12px; border-top: 1px solid rgba(255,255,255,0.8);
  }
  
  /* 排版 A：標準水平 (L1, L2, L5) */
  .layout-horizontal { grid-template-columns: 1fr 1fr; }
  
  /* 排版 B：垂直堆疊 (L3 冰箱) */
  .layout-vertical { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .layout-vertical .bin { flex-direction: row; gap: 20px; padding: 12px 30px; justify-content: flex-start;}
  
  /* 排版 C：不對稱 (L4 挑菜) */
  .layout-asym { grid-template-columns: 2fr 1fr; }
  .layout-asym #bin-good { background: #ecfdf5; border-color: #10b981; } /* 超大洗菜盆 */
  .layout-asym #bin-bad { background: #fff1f2; opacity: 0.9; } /* 小角落垃圾桶 */

  .bin {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px 10px; border-radius: 24px; background: #ffffff;
    border: 2px solid #f1f5f9; cursor: pointer; transition: all 0.1s; 
    box-shadow: 0 10px 20px rgba(0,0,0,0.03);
  }
  .bin:active { transform: scale(0.95); border-color: #10b981; }
  .bin-icon { font-size: 42px; margin-bottom: 4px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
  .bin-label { font-size: 16px; font-weight: 900; color: #475569; text-align: center; }

  /* 結算畫面 */
  #result-screen { padding: 40px 24px; justify-content: center; }
  .result-box { background: rgba(255,255,255,0.9); border-radius: 40px; padding: 40px 24px; text-align: center; margin-bottom: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
  .res-emoji { font-size: 80px; margin-bottom: 16px; }
  .res-title { font-size: 28px; font-weight: 900; color: #059669; margin-bottom: 8px; }
  
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left; margin-bottom: 32px; margin-top: 24px;}
  .metric-item { background: #f8fafc; padding: 16px; border-radius: 20px; border: 1px solid #e2e8f0; }
  .m-label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 4px; }
  .m-val { font-size: 22px; font-weight: 900; color: #0f172a; font-family: monospace; }
  .hl-blue { color: #0284c7; } .hl-orange { color: #ea580c; } .hl-red { color: #e11d48; }
</style>
</head>
<body>

<div id="app-container">

  <div id="home-screen" class="screen active">
    <div class="home-title">家事達人的一天</div>
    <div class="home-desc">請選擇情境。每局固定 10 件家事。</div>
    
    <div class="level-card" onclick="startGame(1)">
      <div class="lv-badge">L1 晨間洗衣</div><div class="lv-title">深淺分類 (基礎反應)</div>
    </div>
    <div class="level-card" onclick="startGame(2)">
      <div class="lv-badge">L2 午後收衣</div><div class="lv-title">衣物歸位 (工作記憶)</div>
    </div>
    <div class="level-card" onclick="startGame(3)">
      <div class="lv-badge">L3 冰箱收納</div><div class="lv-title">生鮮分類 (認知彈性)</div>
    </div>
    <div class="level-card" onclick="startGame(4)">
      <div class="lv-badge">L4 挑菜洗菜</div><div class="lv-title">挑除菜蟲 (抑制控制)</div>
    </div>
    <div class="level-card" onclick="startGame(5)">
      <div class="lv-badge">L5 顧火擺盤</div><div class="lv-title">沸騰關火 (分配注意力)</div>
    </div>
  </div>

  <div id="game-screen" class="screen">
    <div id="header">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="instruction">準備中...</div>
    </div>

    <div id="game-area">
      <div id="item-display"><div id="item-emoji">👕</div></div>
      
      <div id="rule-alert" class="overlay-alert">⚠️ 哎呀記錯了！<br><span id="rule-alert-msg" style="font-size:16px; font-weight:400; margin-top:8px; display:block;">規則反轉</span></div>
      
      <div id="parallel-task" onclick="handleParallelTask()">
        <span style="font-size: 36px;">🥘</span>
        <span style="font-size: 14px; margin-top: 4px;">快關小火</span>
      </div>
    </div>

    <div id="bins-container"></div>
  </div>

  <div id="result-screen" class="screen">
    <div class="result-box">
      <div class="res-emoji">🎉</div>
      <div class="res-title">家事達人！</div>
      <div class="metric-grid">
        <div class="metric-item"><div class="m-label">處理反應時間</div><div class="m-val"><span id="res-planning">0</span> <span style="font-size:12px">ms</span></div></div>
        <div class="metric-item"><div class="m-label">衝動誤點</div><div class="m-val"><span id="res-commission">0</span> <span style="font-size:12px">次</span></div></div>
        <div class="metric-item"><div class="m-label">切換停頓時間</div><div class="m-val"><span id="res-reconfig">N/A</span> <span style="font-size:12px">ms</span></div></div>
        <div class="metric-item"><div class="m-label">無效盲動次數</div><div class="m-val"><span id="res-redundant">0</span> <span style="font-size:12px">次</span></div></div>
      </div>
      <button class="btn" onclick="showScreen('home-screen')">返回選單</button>
    </div>
  </div>

</div>

<script>
const TOTAL_ITEMS = 10;

const LEVEL_CONFIGS = {
  1: {
    inst: "請將衣服依<span class='hl-blue'>深淺色</span>丟入洗衣機",
    bins: [ { id: 'dark', icon: '🎛️', label: '深色機' }, { id: 'light', icon: '🎛️', label: '淺色機' } ],
    layoutClass: 'layout-horizontal',
    generate: () => {
      const isDark = Math.random() > 0.5;
      // 徹底拔除 OS Emoji 色差，統一用T恤，但賦予絕對的深色/淺色 CSS 背景
      return { 
        emoji: '👕', 
        correctBin: isDark ? 'dark' : 'light',
        itemStyle: isDark ? 'background-color: #1e293b; color: #fff;' : 'background-color: #fdfccb; color: #000;'
      };
    }
  },
  2: {
    inst: "收衣服囉！請分類進<span class='hl-blue'>收納籃</span>",
    bins: [ 
      { id: 'top', icon: '🧺', label: '上衣' }, { id: 'bottom', icon: '🧺', label: '褲子' },
      { id: 'sock', icon: '🧺', label: '襪子' }, { id: 'underwear', icon: '🧺', label: '內衣褲' }
    ],
    layoutClass: 'layout-horizontal', // 會自動斷行變 2x2
    generate: () => {
      const types = [
        { type: 'top', emojis: ['👕','🧥','👔'] }, { type: 'bottom', emojis: ['👖','🩳'] },
        { type: 'sock', emojis: ['🧦'] }, { type: 'underwear', emojis: ['🩲'] }
      ];
      const selected = types[Math.floor(Math.random() * types.length)];
      return { emoji: selected.emojis[Math.floor(Math.random() * selected.emojis.length)], correctBin: selected.type, itemStyle: '' };
    }
  },
  3: {
    inst: "蔬菜放<span class='hl-blue'>上層</span>，肉類放<span class='hl-orange'>下層</span>",
    bins: [ { id: 'veg', icon: '🧊', label: '上層 (蔬菜)' }, { id: 'meat', icon: '🧊', label: '下層 (肉類)' } ],
    layoutClass: 'layout-vertical', // 垂直堆疊，模擬真冰箱
    generate: (state) => {
      const isVeg = Math.random() > 0.5;
      const emoji = isVeg ? ['🥦','🥬','🥕'][Math.floor(Math.random()*3)] : ['🥩','🍗','🥓'][Math.floor(Math.random()*3)];
      return { emoji, correctBin: isVeg ? 'veg' : 'meat', itemStyle: '' };
    }
  },
  4: {
    inst: "健康蔬菜放<span class='hl-blue'>大盆子</span>，菜蟲請挑去<span class='hl-red'>垃圾桶</span>！",
    bins: [ { id: 'good', icon: '🥣', label: '大洗菜盆' }, { id: 'bad', icon: '🗑️', label: '垃圾桶' } ],
    layoutClass: 'layout-asym', // 不對稱排版：大盆子 + 小垃圾桶
    generate: () => {
      const isBad = Math.random() > 0.7; 
      const emoji = isBad ? ['🐛','🕷️'][Math.floor(Math.random()*2)] : ['🥬','🥦'][Math.floor(Math.random()*2)];
      return { emoji, correctBin: isBad ? 'bad' : 'good', itemStyle: '' };
    }
  },
  5: {
    inst: "餐具分類擺盤，注意<span class='hl-red'>湯鍋沸騰</span>！",
    bins: [ { id: 'bowl', icon: '🟩', label: '左側餐墊' }, { id: 'plate', icon: '🟧', label: '右側餐墊' } ],
    layoutClass: 'layout-horizontal',
    generate: () => {
      const isBowl = Math.random() > 0.5;
      return { emoji: isBowl ? '🥣' : '🍽️', correctBin: isBowl ? 'bowl' : 'plate', itemStyle: '' };
    }
  }
};

let gs = {
  level: 1, currentCount: 0, isLocked: false, currentItem: {}, itemSpawnTime: 0,
  waitingForReconfig: false, isBoiling: false,
  metrics: { latencies: [], reconfigLatency: null, commission: 0, redundant: 0 }
};

const elItem = document.getElementById('item-display');
const elInst = document.getElementById('instruction');
const elBins = document.getElementById('bins-container');

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(level) {
  gs = {
    level: level, currentCount: 0, isLocked: false, currentItem: {}, itemSpawnTime: 0,
    waitingForReconfig: false, isBoiling: false,
    metrics: { latencies: [], reconfigLatency: null, commission: 0, redundant: 0 }
  };
  
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('rule-alert').classList.remove('show');
  document.getElementById('parallel-task').classList.remove('show');
  
  renderBins();
  elInst.innerHTML = LEVEL_CONFIGS[level].inst;
  
  showScreen('game-screen');
  setTimeout(spawnNextItem, 600);
}

function renderBins() {
  const config = LEVEL_CONFIGS[gs.level];
  // 注入專屬版型 Class
  elBins.className = config.layoutClass;
  elBins.innerHTML = config.bins.map(b => `
    <div class="bin" id="bin-${b.id}" onclick="handleBinTap('${b.id}')">
      <div class="bin-icon">${b.icon}</div>
      <div class="bin-label" id="label-${b.id}">${b.label}</div>
    </div>
  `).join('');
}

function spawnNextItem() {
  if (gs.currentCount >= TOTAL_ITEMS) return endGame();

  elItem.className = '';
  
  if (gs.level === 3 && gs.currentCount === 5 && !gs.waitingForReconfig) {
    gs.waitingForReconfig = true;
    document.getElementById('rule-alert-msg').innerText = "蔬菜改放下層，肉類改放上層！";
    document.getElementById('rule-alert').classList.add('show');
    
    setTimeout(() => { 
      document.getElementById('rule-alert').classList.remove('show');
      // 動態對調按鈕位置 (透過 flex-direction 或 DOM 排序)
      elBins.appendChild(document.getElementById('bin-veg')); 
      document.getElementById('label-veg').innerText = "下層 (蔬菜)";
      document.getElementById('label-meat').innerText = "上層 (肉類)";
      elInst.innerHTML = "蔬菜放<span class='hl-orange'>下層</span>，肉類放<span class='hl-blue'>上層</span>";
      
      generateAndRender(); 
    }, 2500);
    return;
  }

  if (gs.level === 5 && Math.random() > 0.7 && gs.currentCount > 0) {
    gs.isBoiling = true;
    document.getElementById('parallel-task').classList.add('show');
  }

  generateAndRender();
}

function generateAndRender() {
  const data = LEVEL_CONFIGS[gs.level].generate(gs);
  gs.currentItem = data;
  document.getElementById('item-emoji').innerText = data.emoji;
  
  // L1 專用：絕對顏色覆寫
  elItem.style.cssText = data.itemStyle;
  
  gs.itemSpawnTime = Date.now();
  gs.isLocked = false;
}

function handleParallelTask() {
  if (!gs.isBoiling) return;
  gs.isBoiling = false;
  document.getElementById('parallel-task').classList.remove('show');
  const btn = document.getElementById('parallel-task');
  btn.style.transform = "scale(0.8)";
  setTimeout(() => btn.style.transform = "", 150);
}

function handleBinTap(binId) {
  if (gs.isLocked) return;
  
  if (gs.isBoiling) {
    gs.metrics.redundant++;
    triggerErrorAnim();
    return;
  }

  const now = Date.now();
  
  if (binId === gs.currentItem.correctBin) {
    gs.isLocked = true;
    gs.currentCount++;
    document.getElementById('progress-fill').style.width = `${(gs.currentCount / TOTAL_ITEMS) * 100}%`;
    
    const latency = now - gs.itemSpawnTime;
    if (gs.waitingForReconfig) {
      gs.metrics.reconfigLatency = latency;
      gs.waitingForReconfig = false;
    } else {
      gs.metrics.latencies.push(latency);
    }
    
    elItem.classList.add('success-pop');
    setTimeout(spawnNextItem, 300); 
    
  } else {
    gs.metrics.commission++; 
    triggerErrorAnim();
  }
}

function triggerErrorAnim() {
  elItem.classList.remove('shake-error');
  void elItem.offsetWidth; 
  elItem.classList.add('shake-error');
}

function endGame() {
  let avgLatency = 0;
  if (gs.metrics.latencies.length > 0) {
    avgLatency = Math.round(gs.metrics.latencies.reduce((a, b) => a + b, 0) / gs.metrics.latencies.length);
  }

  document.getElementById('res-planning').innerText = avgLatency;
  document.getElementById('res-commission').innerText = gs.metrics.commission;
  document.getElementById('res-reconfig').innerText = gs.metrics.reconfigLatency || 'N/A';
  document.getElementById('res-redundant').innerText = gs.metrics.redundant;
  
  showScreen('result-screen');
}
</script>
</body>
</html>
